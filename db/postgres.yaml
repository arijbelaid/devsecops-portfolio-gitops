apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                printf '%s' "$POSTGRES_PASSWORD" > /tmp/pw
                initdb -D "$PGDATA" -U portfolio -E UTF8 --pwfile=/tmp/pw --auth-local=trust --auth-host=scram-sha-256
                rm -f /tmp/pw
                echo "host all all all scram-sha-256" >> "$PGDATA/pg_hba.conf"
                echo 'CREATE DATABASE portfolio;' | postgres --single -D "$PGDATA" postgres
              fi
              exec postgres -D "$PGDATA" -c listen_addresses='*' -c unix_socket_directories=/tmp
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "portfolio", "-d", "portfolio"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
