apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: app-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: 192.168.159.129/devsecops-portfolio/api
          command: ["sh", "-c"]
          args:
            - |
              npx --yes prisma@5.22.0 migrate deploy > /tmp/migrate.log 2>&1 &
              i=0
              while [ "$i" -lt 90 ]; do
                if grep -qE "successfully applied|No pending migrations" /tmp/migrate.log; then
                  cat /tmp/migrate.log; exit 0
                fi
                if grep -qE "Error: P[0-9]+" /tmp/migrate.log; then
                  cat /tmp/migrate.log; exit 1
                fi
                i=$((i+1)); sleep 2
              done
              cat /tmp/migrate.log; exit 1
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
