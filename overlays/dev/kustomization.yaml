apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devsecops-dev
resources:
  - ../../base
patches:
  - path: replica-patch.yaml
  - path: args-api.yaml
    target:
      kind: Deployment
      name: api-deployment
  - path: args-frontend.yaml
    target:
      kind: Deployment
      name: frontend-deployment
images:
  - name: 192.168.159.129/devsecops-portfolio/api
    newName: hashicorp/http-echo
    digest: sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
  - name: 192.168.159.129/devsecops-portfolio/frontend
    newName: hashicorp/http-echo
    digest: sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
configMapGenerator:
  - name: api-config
    literals:
      - API_URL=http://api-service.dev.svc.cluster.local:5000
